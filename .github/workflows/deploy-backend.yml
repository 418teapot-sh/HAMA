name: Deploy Backend

# main 에 머지되면 EC2 에 배포합니다. PR 리뷰 없이 develop 에 머지하는 팀이라
# develop → main PR 을 "배포해도 되는 상태" 확인 관문으로 씁니다.
#
# 레지스트리(GHCR)를 쓰지 않고 이미지를 파일로 보내서 EC2 에서 docker load 합니다.
# private 레포의 GHCR 는 무료 저장·전송량이 작고, EC2 에 레지스트리 로그인도 필요 없어집니다.
#
# 필요한 Secrets: EC2_HOST(api.todohama.site), EC2_SSH_KEY(배포 전용 키, EC2 authorized_keys 에 등록)
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # Actions 탭에서 수동으로 다시 배포할 때 씁니다.
  workflow_dispatch:

# 배포가 겹치면 뒤의 것이 앞의 것이 끝날 때까지 기다립니다(중간에 끊으면 서버가 어중간해집니다).
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hama-backend:latest backend

      - name: Save image
        run: docker save hama-backend:latest | gzip > hama-backend.tar.gz

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload image and compose file
        run: |
          scp -i ~/.ssh/deploy_key hama-backend.tar.gz backend/deploy/docker-compose.yml \
            ubuntu@${{ secrets.EC2_HOST }}:~/hama/

      # 실패하면 직전 이미지(hama-backend:previous)로 되돌리는 방법:
      #   docker tag hama-backend:previous hama-backend:latest && docker compose up -d
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_HOST }} 'bash -s' <<'EOF'
          set -e
          cd ~/hama
          docker tag hama-backend:latest hama-backend:previous 2>/dev/null || true
          gunzip -c hama-backend.tar.gz | docker load
          rm hama-backend.tar.gz
          docker compose up -d

          # 앱이 뜨는 데 20초 정도 걸립니다. 2분 안에 UP 이 안 되면 배포 실패로 처리합니다.
          for i in $(seq 1 40); do
            if curl -sf localhost:8080/actuator/health > /dev/null; then
              echo "배포 완료"
              docker image prune -f > /dev/null
              exit 0
            fi
            sleep 3
          done
          docker logs --tail 50 hama-app
          exit 1
          EOF
