# 테스트도 운영과 같은 MySQL 로 돌립니다.
#
# H2 로 돌리면 미묘하게 다르게 동작하는 지점이 있어서
# "로컬/CI 에선 됐는데 서버에서 안 되는" 사고가 납니다.
#
# 로컬:  docker compose up -d   (hama_test DB 도 함께 만들어집니다)
# CI:    ci-check.yml 의 mysql service container

jwt:
  secret: test-only-secret-key-do-not-use-in-production-0123456789

app:
  # 테스트는 전부 127.0.0.1 에서 가입·로그인하므로 IP 기준 제한을 사실상 끕니다(AuthLimitProperties).
  auth-limit:
    signup-per-ip: 100000
    login-per-ip: 100000
  goal-progress:
    worker-enabled: false
  cookie:
    path: /api/v1/auth
    secure: false
    same-site: Lax

# 키를 비워둬야 라이너 클라이언트가 비활성 경로를 탑니다.
# 더미 값이라도 넣으면 테스트를 돌릴 때마다 실제 외부 API 로 요청이 나갑니다.
liner:
  api-key:

paddle:
  # 웹훅 서명 검증은 외부 호출이 아니라서 값을 넣어 둡니다(PaymentWebhookIntegrationTest 가 이 키로 서명합니다).
  webhook-secret: test-only-webhook-secret
  credit-price-ids:
    1: pri_test_1
    5: pri_test_5
    12: pri_test_12

spring:
  # 로컬 .env 에 RESEND_API_KEY 가 있어도 테스트가 진짜 메일을 보내지 않도록 비웁니다(라이너·Paddle 키와 같은 이유).
  mail:
    password:
  # @DataJpaTest 는 기본적으로 데이터소스를 내장 DB로 바꿔치기합니다.
  # 그러면 아래 설정이 무시되므로 끕니다.
  test:
    database:
      replace: none
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/hama_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: hama
    password: hama
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    # FlywayCleanTestConfig 가 테스트 시작마다 DB 를 비웁니다. 운영·dev 에서는 기본값(true)이라 clean 이 막혀 있습니다.
    clean-disabled: false
  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)가 만들고, Hibernate 는 엔티티와 맞는지 검사만 합니다.
      ddl-auto: validate
    show-sql: false
