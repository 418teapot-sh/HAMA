spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hama?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: hama
    password: hama
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 로컬은 엔티티를 고치면 테이블도 바로 따라오게 둡니다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 로컬 전용 더미 키입니다. HS256 은 최소 256비트(32바이트) 이상이어야 해서 충분히 길게 잡았습니다.
  # 이 값은 깃에 올라가지만 로컬에서만 쓰이므로 문제되지 않습니다.
  secret: local-only-dummy-secret-key-for-development-do-not-use-in-production

app:
  cookie:
    # http://localhost 에서는 Secure 쿠키가 브라우저에 저장되지 않아 로그인이 막힙니다.
    secure: false
    same-site: Lax

logging:
  level:
    com.hama: DEBUG
    # 쿼리에 바인딩된 실제 파라미터 값까지 보고 싶을 때 켭니다.
    org.hibernate.orm.jdbc.bind: TRACE
