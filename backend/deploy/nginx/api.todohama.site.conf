# /etc/nginx/sites-available/ 에 복사하고 sites-enabled 에 링크합니다.
# HTTPS(443) 설정과 HTTP→HTTPS 리다이렉트는 `certbot --nginx` 가 이 파일에 추가합니다.
server {
    listen 80;
    server_name api.todohama.site;

    # 기본값 1MB 는 요청 본문이 조금만 커도 413 을 냅니다.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Spring(application-dev.yml forward-headers-strategy)은 X-Forwarded-* 를 그대로 믿습니다.
        # 클라이언트가 보낸 값이 넘어가지 않게 전부 Nginx 가 아는 값으로 덮어씁니다.
        # (X-Forwarded-Host 를 위조하면 서버가 만드는 절대 URL 이 다른 도메인을 가리키게 됩니다)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        # 라이너 API 응답을 기다리는 요청(timeout 30초)보다 길게 둡니다.
        proxy_read_timeout 60s;
    }
}
