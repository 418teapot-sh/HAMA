# /etc/nginx/sites-available/ 에 복사하고 sites-enabled 에 링크합니다.
# HTTPS(443) 설정과 HTTP→HTTPS 리다이렉트는 `certbot --nginx` 가 이 파일에 추가합니다.
server {
    listen 80;
    server_name api.todohama.site;

    # 기본값 1MB 는 요청 본문이 조금만 커도 413 을 냅니다.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Spring 이 원래 요청이 https 였다는 걸 알게 합니다(application-dev.yml forward-headers-strategy).
        proxy_set_header X-Forwarded-Proto $scheme;
        # 라이너 API 응답을 기다리는 요청(timeout 30초)보다 길게 둡니다.
        proxy_read_timeout 60s;
    }
}
