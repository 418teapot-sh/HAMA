spring:
  application:
    name: hama
  profiles:
    default: local
  config:
    # 프로젝트 루트의 .env 를 읽습니다. 없으면 그냥 넘어갑니다(optional).
    # 로컬에서 외부 API 키를 넣을 때 쓰고, .env 는 .gitignore 로 막혀 있습니다.
    # dev 는 이 파일 대신 컨테이너 환경변수(서버 ~/hama/.env, deploy/.env.example 참고)를 씁니다.
    import: optional:file:.env[.properties]
  mail:
    # Resend SMTP. 비밀번호 칸에 Resend API 키를 넣습니다. 키가 없으면(로컬·테스트) 메일 대신 로그만 남깁니다(AccountMailSender).
    host: smtp.resend.com
    port: 465
    username: resend
    password: ${RESEND_API_KEY:}
    properties:
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    # 트랜잭션 밖(뷰 렌더링 시점)까지 영속성 컨텍스트를 열어두지 않습니다.
    # 켜두면 요청 내내 DB 커넥션을 붙잡고 있어 커넥션 풀이 금방 마릅니다.
    open-in-view: false
    properties:
      hibernate:
        # 투두를 여러 개 한 번에 조회할 때 N+1 쿼리를 줄여줍니다.
        default_batch_fetch_size: 100

jwt:
  # 기본값을 두지 않습니다. dev 에서 JWT_SECRET 을 빠뜨리면 조용히 공개된 값으로
  # 동작하는 대신 부팅이 실패하도록 합니다. (local 값은 application-local.yml)
  secret: ${JWT_SECRET}
  access-token-validity: 1800000      # 30분 (ms)
  refresh-token-validity: 1209600000  # 14일 (ms)

app:
  cookie:
    # 리프레시 토큰 쿠키가 재발급·로그아웃 요청에만 붙도록 경로를 좁힙니다.
    # 모든 API 에 딸려가면 노출 면적만 넓어집니다.
    path: /api/v1/auth
    # secure / same-site 는 환경마다 달라서 프로필별 파일에서 정합니다.
    # (로컬은 http 라서 Secure 쿠키가 브라우저에 저장되지 않습니다)
  mail:
    # 받는 쪽이 사칭으로 보지 않도록 Resend 에 인증한 도메인 주소여야 합니다. 받는 메일함은 없어도 됩니다.
    from: "HAMA <no-reply@todohama.site>"
    # 비밀번호 재설정 메일의 링크. 뒤에 ?token= 이 붙습니다. 프론트 /reset-password 화면입니다.
    reset-password-url: ${RESET_PASSWORD_URL:https://www.todohama.site/reset-password}
    # 이메일 찾기 문의가 들어오면 알림을 받을 운영자 주소(약관·푸터에 공개된 주소)
    operator: s3unghwan@gmail.com

cors:
  # 배포 시 CORS_ALLOWED_ORIGINS 로 덮어쓰세요.
  # allowCredentials(true) 와 함께 쓰려면 와일드카드는 allowedOriginPatterns 로 넣어야 합니다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

liner:
  # 키가 없어도 부팅은 되게 합니다. JWT_SECRET 과 달리 빈 값이 보안 문제가 되지 않고,
  # 키 없는 팀원도 투두/목표 CRUD 는 개발할 수 있어야 합니다.
  api-key: ${LINER_API_KEY:}
  # OpenAI Chat Completions 호환 API 입니다. (https://liner.com/developers/docs/liner-model-api-chat-completions)
  base-url: ${LINER_BASE_URL:https://platform.liner.com/api/v1}
  model: ${LINER_MODEL:liner-mark-1.1}
  # 라이너가 느릴 때 요청 스레드가 무한정 매달리지 않도록 합니다.
  timeout-seconds: 30
  # 토큰 절감: 아래 값들은 LinerAiClient 한 곳에서만 적용됩니다. 도메인 코드에서 따로 자르지 마세요.
  max-completion-tokens: 2000
  max-history-messages: 12
  reasoning-effort: low

paddle:
  api-key: ${PADDLE_API_KEY:}
  # 웹훅 서명 검증용. 이게 없으면 아무나 "결제 완료" 웹훅을 위조해서
  # 크레딧을 충전할 수 있습니다.
  webhook-secret: ${PADDLE_WEBHOOK_SECRET:}
  # 충전 횟수 → Paddle 가격 ID(pri_...). 카탈로그 상품 3개와 맞춥니다. Sandbox 와 Live 의 값이 다릅니다.
  # 여기 없는 가격으로 결제가 오면 충전하지 않고 에러 로그를 남깁니다.
  credit-price-ids:
    1: ${PADDLE_PRICE_ID_1:}
    5: ${PADDLE_PRICE_ID_5:}
    12: ${PADDLE_PRICE_ID_12:}

logging:
  pattern:
    # TraceIdFilter 가 MDC 에 넣은 traceId 를 로그 한 줄마다 찍습니다.
    # 이게 없으면 응답에 traceId 가 와도 서버 로그에는 안 남아서 그 값으로 검색할 수 없습니다.
    # (correlation 은 Boot 기본 로그 패턴 안에 끼워지는 자리라 나머지 형식은 그대로 유지됩니다)
    correlation: "[%X{traceId:-}] "

management:
  endpoints:
    web:
      exposure:
        # health, info 만 노출합니다. "*" 로 두면 /actuator/env 에서
        # JWT_SECRET · DB 비밀번호 · 라이너 키가 전부 보입니다.
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # 메일 서버(Resend)가 잠깐 안 되면 /actuator/health 가 DOWN 이 되고, ALB 가 멀쩡한 서버를 비정상으로 보고 ASG 가 갈아치웁니다.
      # 메일은 부가 기능이라 서버 상태에 넣지 않습니다.
      enabled: false
