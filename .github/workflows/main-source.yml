name: Main Source

# main 으로는 develop 에서만 PR 을 올리게 막습니다.
# 룰셋에는 출발 브랜치를 제한하는 옵션이 없어서 필수 체크로 대신합니다.
# 급한 수정은 관리자 우회로 처리합니다.
on:
  pull_request:
    branches: [ main ]

jobs:
  # job id 가 곧 룰셋 필수 체크 이름입니다. 바꾸면 룰셋도 같이 바꿔야 합니다.
  main-source:
    runs-on: ubuntu-24.04
    steps:
      # 포크의 develop 브랜치도 이름이 같으므로 레포까지 비교합니다.
      - if: github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository
        # 브랜치 이름은 PR 을 올린 사람이 정하는 값이라 run 에 ${{ }} 로 바로 넣으면 셸 명령이 주입됩니다.
        # env 로 넘기면 셸이 문자열로만 다룹니다.
        env:
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}:${{ github.head_ref }}
        run: |
          echo "main 으로는 이 레포의 develop 에서만 PR 을 올릴 수 있습니다. (현재: $HEAD)"
          exit 1
