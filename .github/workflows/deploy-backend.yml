name: Deploy Backend

# main 에 머지되면 배포합니다. PR 리뷰 없이 develop 에 머지하는 팀이라
# develop → main PR 을 "배포해도 되는 상태" 확인 관문으로 씁니다.
#
# 이미지를 ECR 에 올리고 ASG(hama-asg) 인스턴스 새로 고침으로 서버를 갈아끼웁니다.
# 새 서버는 시작 템플릿(hama-lt)의 user data(backend/deploy/user-data.sh)로 부팅하면서
# ECR 의 latest 이미지와 SSM /hama/* 환경변수를 받아 앱을 띄웁니다.
# 새 서버를 먼저 띄우고 ALB 상태 검사를 통과해야 옛 서버를 내리므로(최소 정상 100%), 새 이미지가 안 뜨면 옛 서버가 그대로 남습니다.
#
# AWS 인증은 액세스 키 없이 OIDC 로 역할(hama-github-deploy)을 잠깐 빌립니다. main 브랜치에서만 빌릴 수 있습니다.
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # Actions 탭에서 수동으로 다시 배포할 때 씁니다.
  workflow_dispatch:

# 배포가 겹치면 뒤의 것이 앞의 것이 끝날 때까지 기다립니다(인스턴스 새로 고침은 동시에 하나만 됩니다).
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hama-backend
  ASG_NAME: hama-asg

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::511634956382:role/hama-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 새 이미지가 안 뜨면 latest 를 되돌리려고, 올리기 전에 지금 latest 의 매니페스트를 받아 둡니다.
      - name: Remember current image
        run: |
          aws ecr batch-get-image --repository-name $ECR_REPOSITORY --image-ids imageTag=latest \
            --query 'images[0].imageManifest' --output text > previous-manifest.json

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA -t $REGISTRY/$ECR_REPOSITORY:latest backend
          docker push --all-tags $REGISTRY/$ECR_REPOSITORY

      # 부팅(약 3분) + 앱 기동 + ALB 상태 검사 2회라 보통 5분 안팎입니다. 20분 넘으면 실패로 봅니다.
      - name: Refresh instances
        run: |
          ID=$(aws autoscaling start-instance-refresh --auto-scaling-group-name $ASG_NAME \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":60}' \
            --query InstanceRefreshId --output text)
          for i in $(seq 1 80); do
            STATUS=$(aws autoscaling describe-instance-refreshes --auto-scaling-group-name $ASG_NAME \
              --instance-refresh-ids $ID --query 'InstanceRefreshes[0].Status' --output text)
            echo "$STATUS"
            case $STATUS in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed) exit 1 ;;
            esac
            sleep 15
          done
          exit 1

      # 새 서버가 안 떠서 실패했으면 옛 서버는 살아 있습니다. 나중에 ASG 가 서버를 새로 띄울 때
      # 깨진 이미지를 받지 않도록 latest 만 직전 이미지로 되돌립니다.
      - name: Restore previous image tag
        if: failure() && hashFiles('previous-manifest.json') != ''
        run: |
          aws ecr put-image --repository-name $ECR_REPOSITORY --image-tag latest \
            --image-manifest file://previous-manifest.json > /dev/null
          echo "latest 를 직전 이미지로 되돌렸습니다."
